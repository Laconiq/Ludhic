server {
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # nginx écoute en interne sur 3000, derrière le reverse proxy de Dokploy.
  # Sans ceci, la redirection automatique de trailing-slash (déclenchée par
  # `$uri/` dans try_files ci-dessous, ex. /games/x -> /games/x/) construit
  # une URL absolue avec ce port interne (http://ludhic.fr:3000/...), que le
  # navigateur essaie de joindre directement — port firewallé côté externe,
  # la requête reste bloquée jusqu'au timeout. Une redirection relative
  # laisse le navigateur réutiliser le host:port qu'il a déjà (443 via le
  # proxy), donc pas de round-trip perdu ni de blocage.
  absolute_redirect off;

  gzip on;
  gzip_vary on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

  error_page 404 /404.html;
  location = /404.html {
    internal;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
  }

  # Build Astro (hash de contenu dans le nom de fichier) : jamais réutilisé
  # sous un autre contenu, donc cache immuable en toute sécurité.
  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    try_files $uri =404;
  }

  # Dossiers de assets purement statiques.
  location ~ ^/(images|videos|fonts)/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    try_files $uri =404;
  }

  # Sous /games, seuls les fichiers d'assets sont immuables : les pages HTML
  # (/games/, /games/<slug>/, /games/year/<year>/) doivent rester
  # revalidables, sinon un visiteur garde une page périmée pendant un an.
  location ~ ^/games/[^/]+/[^/]+\.(webp|avif|png|jpe?g|gif|svg|webm|mp4)$ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    try_files $uri =404;
  }

  location / {
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    try_files $uri $uri.html $uri/ =404;
  }
}
